:root {
  color-scheme: light;
  font-family: Cairo,Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;
  color: #212529;
  background: #f4f6f9;
  --nav: linear-gradient(to left,#3e4162,#2b2e4a);
  --blue: #0d6efd;
  --green: #198754;
  --muted: #6c757d;
  --line: #e1e5e9;
  --shadow: 0 5px 16px rgb(32 45 60 / 8%);
}
*,*::before,*::after { box-sizing: border-box }
[hidden] { display:none!important }
body { margin:0; line-height:1.5 }
a { color:var(--blue); text-underline-offset:3px }
button,input,select,textarea { font:inherit }
button { cursor:pointer }
button:disabled { cursor:wait; opacity:.6 }
:focus-visible { outline:3px solid #7489e5; outline-offset:3px }
h1[tabindex="-1"]:focus { outline:none }
h1,h2,h3,h4,p { margin-top:0 }
h1,h2,h3 { line-height:1.28 }
h1 { margin-bottom:10px; font-size:clamp(28px,3.1vw,40px); font-weight:650 }
h2 { font-size:28px; margin-bottom:18px }
h3 { font-size:19px; margin-bottom:9px }
p { margin-bottom:12px }
.muted,small { color:var(--muted) }
.small { font-size:14px }
.center { text-align:center }
.container { width:min(100% - 32px,1110px); margin-inline:auto }
.wide { width:min(100% - 32px,1450px); margin-inline:auto }
.gap { margin-block:22px }
.stack > *+* { margin-block-start:14px }
.btns { display:flex; align-items:center; flex-wrap:wrap; gap:8px }
.btns.center { justify-content:center }
.btn {
  display:inline-flex; justify-content:center; align-items:center; gap:6px;
  min-height:37px; padding:6px 13px; border:1px solid transparent; border-radius:6px;
  background:var(--blue); color:white; text-decoration:none; white-space:normal;
}
.btn:hover { filter:brightness(.93) }
.btn.soft { background:white; color:#434950; border-color:#cbd1d8 }
.btn.green { background:var(--green) }
.btn.danger { background:white; color:#b22935; border-color:#e3b7ba }
.btn.warning { background:#ffc107; color:#252018; font-weight:700 }
.btn.outline-light { background:transparent; color:#fff; border-color:#d1d2dc }
.btn.tiny { min-height:30px; padding:4px 8px; font-size:13px }
.block { width:100% }
.card { background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow) }
.pad { padding:19px }
.card-header { padding:13px 17px; border-bottom:1px solid var(--line); border-radius:9px 9px 0 0; background:#f7f8fa }
.card-header h2,.card-header h3 { margin:0 }
.grid2,.grid3,.grid4,.fields { display:grid; gap:18px }
.grid2 { grid-template-columns:repeat(2,minmax(0,1fr)) }
.grid3 { grid-template-columns:repeat(3,minmax(0,1fr)) }
.grid4 { grid-template-columns:repeat(4,minmax(0,1fr)) }
.fields { grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); gap:12px }
.fields.tight { grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr)) }
.field { display:grid; align-content:start; gap:5px; margin:0; min-width:0; font-size:14px }
.stack .field { margin-bottom:15px }
.field input:not([type=checkbox]):not([type=radio]), .field select,.field textarea,.table-input {
  width:100%; padding:6px 10px; min-height:36px; border:1px solid #d4d9de; border-radius:6px;
  background:#fff; color:#212529;
}
.field textarea { resize:vertical; min-height:95px }
.field input:focus,.field select:focus,.field textarea:focus,.table-input:focus { outline:none; border-color:#86b7fe; box-shadow:0 0 0 3px #dceaff }
.field .required { color:#a62739 }
.check { display:flex; align-items:center; gap:7px; min-height:37px; font-size:14px }
input[type=checkbox],input[type=radio] { accent-color:var(--blue); width:16px; height:16px; margin:0 }
input[type=file] { cursor:pointer; max-width:100% }
.notice { border:1px solid #d3e3f5; background:#edf5ff; color:#23476c; padding:10px 13px; border-radius:7px; margin-block:12px }
.notice.ok { border-color:#c9e2d4; background:#eaf7ee; color:#1d6544 }
.notice.warn { border-color:#f1deb3; background:#fff7e2; color:#775613 }
.notice.error { border-color:#efc5c8; background:#fff0f1; color:#9a2732 }
.year { display:inline-block; background:#e8f5eb; color:#197349; border:1px solid #cce6d4; padding:5px 10px; border-radius:5px; font-size:14px; white-space:nowrap }
.toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px }
.page-heading { padding-block:22px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap }
.page-heading h1 { color:#0b69e2 }
.page-heading p { margin:0 }
.key { font-weight:700; unicode-bidi:isolate }
.home-nav,.admin-nav { background:var(--nav); color:white; z-index:10 }
.home-nav { position:sticky; top:0 }
.home-nav .container { display:flex; justify-content:space-between; align-items:center; gap:16px; min-height:56px }
.home-nav a { color:#fff; text-decoration:none }
.home-brand { font-size:19px; font-weight:700 }
.home-nav .nav-links { display:flex; gap:14px; font-size:14px; flex-wrap:wrap }
.home-hero { color:#fff; background:linear-gradient(135deg,#2b2e4a 0%,#3e4162 60%,#48507a 100%); padding:66px 0; min-height:354px }
.split { display:grid; grid-template-columns:7fr 5fr; gap:28px; align-items:center }
.home-hero h1 { font-size:clamp(35px,5vw,48px); margin-bottom:12px; font-weight:750 }
.home-hero .lead { color:#d9dbe6; font-size:19px; margin-bottom:22px }
.home-hero aside { color:#252a30; border-radius:16px; padding:23px 27px }
.home-hero ul { margin:10px 0 0; padding-inline-start:21px; font-size:14px; color:#50555b }
.home-hero li+li { margin-top:7px }
.home-section { padding-block:45px; background:#fff }
.home-section:nth-of-type(even) { background:#f7f8fa }
.home-section .feature { box-shadow:none; padding:16px; min-height:118px }
.feature p { color:#555d65; margin:0; font-size:14px }
.feature .symbol { color:#35395b; display:block; font-size:23px; margin-bottom:4px }
.home-link { color:inherit; text-decoration:none; font-weight:700; box-shadow:none }
.home-link:hover { border-color:#80b5f8; color:var(--blue) }
.home-footer { color:#eee; background:var(--nav); padding:18px 0 }
.home-footer a { color:#eee }
.public-screen { min-height:100svh; padding:26px 14px 32px }
.public-screen.mid { display:grid; place-content:center }
.auth-card { width:min(100%,450px); padding:29px; margin-inline:auto; border-radius:16px; box-shadow:0 12px 26px rgb(35 48 66 / 10%) }
.auth-card.registration { width:min(100%,545px); padding:23px; margin-top:22px }
.auth-card.guardian { border-radius:24px; padding:20px 17px; width:min(450px,calc(100vw - 28px)); box-shadow:0 12px 28px rgb(54 61 112 / 20%) }
.wordmark {
  display:flex; align-items:center; justify-content:center; gap:14px; min-height:105px;
  margin:0 auto 23px; padding:15px; background:#2d3f50; color:#fff;
  border-radius:15px; box-shadow:0 7px 14px rgb(25 37 50 / 18%);
}
.wordmark strong { display:block; font-size:22px }
.wordmark small { color:#e9eff5; display:block }
.wordmark .emblem { font-size:32px; color:#c9deed }
.registration .wordmark,.guardian .wordmark { max-width:330px; min-height:92px }
.auth-title { margin-bottom:22px; text-align:center; color:#6c757d; font-size:21px; font-weight:500 }
.guardian .auth-title { font-size:28px; margin-bottom:5px; color:#2d3f50; font-weight:650 }

function routeForClass(cls) {
  if (CLASSES.slice(0,2).includes(cls)) return 'add_kindergarten_grades';
  if (CLASSES.slice(2,7).includes(cls)) return 'add_grades';
  if (CLASSES.slice(7,10).includes(cls)) return 'student-grades-sse';
  return ['student-grades-ninth','student-grades-first-secondary','student-grades-second-secondary','student-grades-third-secondary'][CLASSES.indexOf(cls)-10];
}
function gradePlan(route, cls, stream) {

  if (route === 'add_kindergarten_grades') {
    return {components:['الفترة الأولى','الفترة الثانية'], items:KINDERGARTEN.map((label,i)=>({key:'kg'+i,label,choices:['متقن','جيّد','قيد التعلم','يحتاج دعم']}))};
  }
  if (route === 'add_activity_grades') {
    const choices = ['مقبول','جيد','جيد جداً','ممتاز'];
    return {components:CLASSES.indexOf(cls)<7?['الفترة 1','الفترة 2','الفترة 3']:['الفصل الأول','الفصل الثاني'], items:['ar','mu','sp','ex','un'].map((key,i)=>({key,label:SUBJECTS[key],choices:i<3?choices:null,max:[180,180,180]}))};
  }
  if (route === 'add_grades') {
    names = ['أعمال فترة أولى - فترة 1','أعمال فترة ثانية - فترة 2','أعمال فترة ثالثة - فترة 3'];
    weights = [.3,.3,.4];
    totals = ['الرابع','الخامس'].includes(cls)?UPPER_PRIMARY:cls==='الثالث'?{...BASE_PRIMARY,s:80}:BASE_PRIMARY;
  } else if (route === 'student-grades-ninth' || route === 'student-grades-third-secondary') {
    names = ['أعمال - فترة 1','أعمال - فترة 2']; weights = [.5,.5];
    totals = route==='student-grades-ninth'?NINTH:stream==='أدبي'?THIRD_ARTS:THIRD_SCIENCE;
  } else if (route === 'remedial_grades') {
    const primary=['الرابع','الخامس'].includes(cls);
    names = ['امتحان الدور الثاني']; weights = [primary ? .4 : .6];
    totals = primary?UPPER_PRIMARY:cls==='السادس'?SIXTH:cls==='الأول ثانوي'?FIRST_SECONDARY:cls==='الثاني ثانوي'?(stream==='أدبي'?SECOND_ARTS:SECOND_SCIENCE):UPPER_TRANSPORT;
  } else {
    names = SEMESTERS; weights = [.2,.3,.2,.3];

  }
  return {components:names,items:Object.entries(totals).map(([key,total])=>({key,label:route==='student-grades-ninth'&&key==='a'?'النحو والقراءة والنصوص':SUBJECTS[key],max:weights.map(weight=>Math.round(total*weight))}))};
}

function cleanWorkflowText(value,maximum,required=false) {
  if(typeof value!=='string')value='';
  const clean=value.trim();
  if(clean.length>maximum||required&&!clean)throw new Error(required?'أكمل الحقول المطلوبة وتحقق من طولها.':'النص أطول من الحد المسموح.');
  return clean;
}
function gradeRouteAccepts(source,cls) {
  if(source==='add_activity_grades')return CLASSES.indexOf(cls)>=2;
  if(source==='remedial_grades')return REMEDIAL_CLASSES.includes(cls);
  return routeForClass(cls)===source;
}
function validatedGrade(value,item,index) {
  const text=String(value??'').trim().replace(/[٠-٩۰-۹]/g,c=>String(c.charCodeAt(0)%16)).replace(/٫/g,'.');
  if(!text)return null;
  if(item.choices){
    if(item.choices.includes(text))return text;
    throw new Error('التقدير غير صالح.');
  }
  const mark=Number(text), max=item.max[index];
  if(!/^\d+(?:\.\d+)?$/.test(text)||!Number.isFinite(mark)||mark<0||mark>max)throw new Error(item.label+' · أدخل درجة بين 0 و'+max+'.');
  return Math.round(mark*10)/10;
}
function setGradeMark(s,student,source,subject,index,value) {
  if(!student||student.archive||!gradeRouteAccepts(source,student.cls))throw new Error('السجل خارج كشف الدرجات المحدد.');
  const plan=gradePlan(source,student.cls,student.stream);
  const item=plan.items.find(row=>row.key===subject);
  if(!item||!Number.isInteger(index)||index<0||index>=plan.components.length)throw new Error('تعذر مطابقة المادة والفترة.');
  const mark=validatedGrade(value,item,index), key=gradeKey(source,subject,index);
  const record=s.grades[student.id] ||= {};
  if(mark===null)delete record[key];
  else record[key]=mark;
  return mark;
}

  if(from===to||!Object.hasOwn(root.schools,to))throw new Error('اختر مدرسة مستقبلة مختلفة.');
  const student=root.schools[from].students.find(s=>s.id===studentId&&s.year===year&&!s.archive);
  if(!student)throw new Error('الطالب غير متاح للنقل.');
  if(root.transfers.some(t=>t.from===from&&t.student===studentId&&t.status==='pending'))throw new Error('يوجد طلب نقل قيد المراجعة لهذا الطالب.');
  const request={id,from,to,student:studentId,year,reg:student.reg,name:student.name,cls:student.cls,stream:student.stream||'',note:cleanWorkflowText(note,1200),status:'pending',date:workflowTimestamp()};
  root.transfers.push(request);

}

function canteenSale(s,reg,itemId,quantity,year,date,id) {
  if(!Number.isInteger(quantity)||quantity<1||quantity>50)throw new Error('أدخل كمية صالحة.');
  const student=s.students.find(x=>x.year===year&&x.reg===reg&&!x.archive), item=s.items.find(x=>x.id===itemId);
  if(!student)throw new Error('رقم القيد غير موجود.');
  const rows=s.wallet.filter(r=>r.student===student.id);
  const balance=rows.reduce((total,row)=>total+row.amount,0);
  const prior=s.wallet.find(row=>row.id===id);
  if(prior) {
    if(prior.student!==student.id||prior.item!==itemId||prior.quantity!==quantity)throw new Error('سبق استخدام معرّف هذه العملية.');
    return {total:-prior.amount,balance};
  }
  if(!item||item.stock<quantity)throw new Error('الكمية غير متاحة.');
  const spent=rows.filter(r=>r.amount<0&&r.date===date).reduce((total,row)=>total-row.amount,0);
  const limit=s.walletLimits?.[student.id]||0, cost=item.price*quantity;
  if(balance<cost||limit&&spent+cost>limit)throw new Error('الرصيد أو سقف الصرف غير كاف.');
  item.stock-=quantity;
  s.wallet.push({id,student:student.id,item:itemId,quantity,date,label:item.name+' × '+quantity,amount:-cost});
  return {total:cost,balance:balance-cost};
}
function gradeSummary(plan,source,marks,indices=null) {
  let recorded=false, complete=true, total=0, max=0;
  const rows=plan.items.map(item=>{
    const indexes=indices??plan.components.map((_,i)=>i);
    const values=indexes.map(i=>marks[source+'|'+item.key+'|'+i]);
    if(values.some(v=>v!==undefined))recorded=true;
    if(values.some(v=>v===undefined))complete=false;
    if(item.choices)return [item.label,values.map(v=>v??'—').join(' / '),'—'];
    const upper=indexes.reduce((sum,i)=>sum+item.max[i],0);
    const grade=values.reduce((sum,v)=>sum+Number(v||0),0);
    if(values.every(v=>v!==undefined)){total+=grade;max+=upper;}
    return [item.label,values.every(v=>v!==undefined)?Math.round(grade*10)/10:'—',upper];
  });
  return {rows,available:recorded,complete,total:Math.round(total*10)/10,max,percent:complete&&max?Math.round(total/max*10000)/100:null};
}
function classifyResult(result,rule) {
  if(!rule?.enabled||!result.complete||result.percent===null)return {status:'',weak:[]};
  const weak=result.rows.filter(([,mark,max])=>typeof mark==='number'&&max>0&&mark*100<Number(rule.subject)*max)
    .map(([label,mark,max])=>({label,mark,max,need:Math.ceil((Number(rule.subject)*max/100-mark)*10-1e-8)/10}));
  const hasAverage=result.total*100>=Number(rule.overall)*result.max;
  const status=hasAverage&&!weak.length?'ناجح':weak.length&&weak.length<=Number(rule.remedial)?'دور ثان':'راسب';
  return {status,weak};
}

const teacherAttendanceKey=(group,date,lesson)=>[group.id,date,lesson].join('|');
function teacherSchedule(s,staff,groups) {

    for(const [slot,item] of Object.entries(record.slots||{})){
      if(item.teacher!==staff.id)continue;
      const [day,period]=slot.split('|'), index=Number(period);
      if(!days.includes(day)||!Number.isInteger(index)||index<0||index>=PERIODS.length)continue;
      const group=groups.find(a=>a.subject===item.subject&&a.cls===record.cls&&a.section===record.section&&a.shift===record.shift);
      const subject=subjects.get(item.subject)||'';
      const value=[subject,record.cls,record.section,record.shift].filter(Boolean).join(' · ');
      (cells.get(slot)||cells.set(slot,[]).get(slot)).push(value);

    lh.setUint32(14,crc,true);
    lh.setUint32(18,contents.length,true);
    lh.setUint32(22,contents.length,true);
    lh.setUint16(26,nameBytes.length,true);
    localHeader.set(nameBytes,30);
    cd.setUint32(0,0x02014b50,true);
    cd.setUint16(4,20,true);
    cd.setUint16(6,20,true);
    cd.setUint32(16,crc,true);
    cd.setUint32(20,contents.length,true);
    cd.setUint32(24,contents.length,true);
    cd.setUint16(28,nameBytes.length,true);
    cd.setUint32(42,offset,true);
    directory.set(nameBytes,46);

function xmlDocument(data) {

async function readExcel(file) {

    const start = offset+30+view.getUint16(offset+26,true)+view.getUint16(offset+28,true);

  });

const LOGO_EXTENSIONS=['.png','.jpg','.jpeg','.jfif','.webp','.gif','.bmp','.svg','.avif'];
const LOGO_ACCEPT=[...LOGO_EXTENSIONS,'image/png','image/jpeg','image/webp','image/gif','image/bmp','image/svg+xml','image/avif'].join(',');
const LOGO_FORMATS='PNG، JPG، WebP، GIF، BMP، SVG، AVIF';
const LOGO_INPUT_LIMIT=20_000_000;
const LOGO_OUTPUT_LIMIT=1_500_000;
const LOGO_MAX_SIDE=1600;

function readDataURL(file) {
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('تعذر قراءة الملف.'));
    reader.readAsDataURL(file);
  });
}
function logoSource(bytes) {
  const isText=(start,text)=>Array.from(text).every((letter,i)=>bytes[start+i]===letter.charCodeAt(0));
  if(bytes[0]===137&&isText(1,'PNG')&&bytes[4]===13&&bytes[5]===10&&bytes[6]===26&&bytes[7]===10)return 'image/png';
  if(bytes[0]===255&&bytes[1]===216&&bytes[2]===255)return 'image/jpeg';
  if(isText(0,'RIFF')&&isText(8,'WEBP'))return 'image/webp';
  if(isText(0,'GIF87a')||isText(0,'GIF89a'))return 'image/gif';
  if(isText(0,'BM'))return 'image/bmp';
  if(isText(4,'ftyp')){
    for(let i=8;i+4<=Math.min(bytes.length,128);i+=4)if(isText(i,'avif')||isText(i,'avis'))return 'image/avif';
  }
  return '';
}
function vectorLogo(bytes) {
  const xml=new TextDecoder().decode(bytes);
  if(!/^\s*</.test(xml)||/<!DOCTYPE/i.test(xml))return null;
  const parsed=new DOMParser().parseFromString(xml,'image/svg+xml'), root=parsed.documentElement;
  if(root.localName!=='svg'||root.namespaceURI!=='http://www.w3.org/2000/svg'||parsed.querySelector('parsererror'))return null;
  const box=root.getAttribute('viewBox')?.trim().split(/[ ,]+/).map(Number);
  if(box?.length===4&&box.every(Number.isFinite)&&box[2]>0&&box[3]>0){
    const width=root.getAttribute('width'), height=root.getAttribute('height');
    if(!width||!height||width.endsWith('%')||height.endsWith('%')){
      const ratio=LOGO_MAX_SIDE/Math.max(box[2],box[3]);
      root.setAttribute('width',String(Math.max(1,Math.round(box[2]*ratio))));
      root.setAttribute('height',String(Math.max(1,Math.round(box[3]*ratio))));
    }
  }
  return new Blob([new XMLSerializer().serializeToString(root)],{type:'image/svg+xml'});
}
function logoImage(url) {
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('تعذر فتح الصورة. تحقق من سلامة الملف ودعم صيغته في المتصفح.'));
    img.src=url;
  });
}
const imageBlob=(canvas,type,quality)=>new Promise(resolve=>canvas.toBlob(resolve,type,quality));
async function logoFile(file) {
  if(!file?.name&&!file?.size)return '';
  if(!file.size)throw new Error('ملف الصورة فارغ.');
  if(file.size>LOGO_INPUT_LIMIT)throw new Error('اختر صورة لا تتجاوز 20 ميغابايت.');
  const bytes=new Uint8Array(await file.arrayBuffer()), type=logoSource(bytes);
  const source=type?new Blob([bytes],{type}):vectorLogo(bytes);
  if(!source)throw new Error('اختر ملف صورة صالحًا بإحدى الصيغ التالية: '+LOGO_FORMATS+'.');
  const url=URL.createObjectURL(source);
  try{
    const img=await logoImage(url), width=img.naturalWidth, height=img.naturalHeight;
    if(!width||!height)throw new Error('أبعاد الصورة غير صالحة.');
    if(['image/png','image/jpeg','image/webp'].includes(type)&&source.size<=LOGO_OUTPUT_LIMIT&&Math.max(width,height)<=LOGO_MAX_SIDE)return readDataURL(source);
    const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
    if(!ctx)throw new Error('تعذر تجهيز الصورة في هذا المتصفح.');
    for(const side of [LOGO_MAX_SIDE,1200,900,640]){
      const scale=Math.min(1,side/Math.max(width,height));
      canvas.width=Math.max(1,Math.round(width*scale));
      canvas.height=Math.max(1,Math.round(height*scale));
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const preferred=await imageBlob(canvas,type==='image/jpeg'?'image/jpeg':'image/png',.94);
      if(preferred?.size&&preferred.size<=LOGO_OUTPUT_LIMIT)return readDataURL(preferred);
      const compressed=await imageBlob(canvas,'image/webp',.94);
      if(compressed?.size&&compressed.size<=LOGO_OUTPUT_LIMIT)return readDataURL(compressed);
    }
    throw new Error('تعذر تجهيز الشعار بالحجم المناسب.');
  }finally{
    URL.revokeObjectURL(url);
  }
}
function imageMarkup(value,label,classes='') {
  if(typeof value!=='string'||!/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(value))return '';
  return `<img${classes?' class="'+esc(classes)+'"':''} src="${esc(value)}" alt="${esc(label)}">`;
}

const bounded = (value,min,max,fallback) => {

function paperFrame(title,year,body,{variant='roster',profile=school().profile,settings={},meta='',signatures=true,page=0,pages=0}={}) {

  ].join(';');

  return `<article class="school-paper paper-${variant}${settings.borderType==='box'?' paper-box':''}" style="${esc(style)}" dir="rtl"><div class="school-paper-content">${paperHeading(title,profile)}${meta?'<div class="paper-meta">'+meta+'</div>':''}${body}${sign}</div><footer class="school-paper-foot"><div class="paper-footer-line"><span>${esc(stamp)}</span><span>السنة الدراسية <bdi>${esc(year)}</bdi></span><span>تاريخ الطباعة: <bdi>${esc(dayISO())}</bdi></span>${pages>1?`<bdi>${page} / ${pages}</bdi>`:''}</div></footer></article>`;
}
function paperTable(headers,rows,name='الكشف') {
  return table(headers,rows,{name,className:'school-paper-table'});
}
function paperPages(title,year,headers,groups,settings={}) {
  const orientation=settings.orientation||'عمودي';
  const fontSize=bounded(settings.fontSize,10,24,14);
  const count=bounded(settings.rowsPerPage,5,100,28);
  const tall=orientation==='أفقي'?650:900;
  const cellPadding=Math.max(1,Math.min(6,Math.floor((tall/(count+1)-fontSize*1.2-1)/2)));
  const fit=Math.max(5,Math.floor(tall/(fontSize*1.2+cellPadding*2+Math.max(1,Number(settings.borderWidth)||1)))-1);
  const rowsPerPage=Math.min(count,fit)*(settings.twoColumns?2:1);
  const paper=(rows,meta,page,pages)=>{
    const mid=Math.ceil(rows.length/2);
    const body=settings.twoColumns&&rows.length>1
      ? '<div class="paper-columns">'+paperTable(headers,rows.slice(0,mid),title)+paperTable(headers,rows.slice(mid),title)+'</div>'
      : paperTable(headers,rows,title);
    return paperFrame(title,year,body,{variant:settings.variant||'roster',meta,settings:{...settings,cellPadding},page,pages});
  };
  const measure=document.createElement('div');
  measure.className='paper-measure';
  measure.dataset.orientation=orientation==='أفقي'?'landscape':'portrait';
  measure.setAttribute('aria-hidden','true');
  document.body.append(measure);
  const maxHeight=(orientation==='أفقي'?210:297)*96/25.4-2;
  function fitRows(rows,meta) {
    let low=1, high=rows.length;
    while(high>low) {
      const count=Math.ceil((low+high)/2);
      measure.innerHTML=paper(rows.slice(0,count),meta,1,2);
      if(measure.firstElementChild.getBoundingClientRect().height<=maxHeight)low=count;
      else high=count-1;
    }
    return rows.slice(0,low);
  }
  const chunks=[];
  try {
    for(const group of groups.length?groups:[{rows:[],meta:''}]) {
      if(!group.rows.length)chunks.push(group);
      for(let from=0;from<group.rows.length;){
        const rows=fitRows(group.rows.slice(from,from+rowsPerPage),group.meta);
        chunks.push({rows,meta:group.meta});
        from+=rows.length;
      }
    }
  } finally {
    measure.remove();
  }
  const markup=chunks.map((chunk,i)=>paper(chunk.rows,chunk.meta,i+1,chunks.length)).join('');
  return {markup,orientation,rows:groups.flatMap(group=>group.rows)};
}
function schoolListReport(title,year,headers,groups,settings={}) {
  const {markup,orientation,rows}=paperPages(title,year,headers,groups,settings);
  showDocument(title,headers,rows,markup,orientation,direction=>paperPages(title,year,headers,groups,{...settings,orientation:direction}).markup);
}

async function passwordHash(password,salt) {
  if(!crypto.subtle)throw new Error('فتح النموذج في متصفح حديث مطلوب لإنشاء حساب العرض.');
  const key=await crypto.subtle.importKey('raw',utf8.encode(password),'PBKDF2',false,['deriveBits']);
  const result=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:utf8.encode(salt),iterations:150000},key,256);
  return [...new Uint8Array(result)].map(n=>n.toString(16).padStart(2,'0')).join('');
}

async function findPublic(data,parent,schoolId=activeSchoolId) {
  const key=digits(data.query);
  const year=YEARS.includes(data.year)?data.year:YEAR;
  if(!key)throw new Error('أدخل رقم القيد أو الرقم الوطني.');
  let rows;
  if(sharedMode) {
    publicProof={school:str(data.school),query:key,pin:digits(data.pin),kind:parent?'parents':'results',year};
    try {
      publicData=await sharedAPI('/api/lookup',publicProof);
      rows=publicData.students;
    } catch(error) {
      if(error.status!==404)throw error;
      publicData=null;publicMatches=[];publicProof=null;publicPage=route;publicKey=key;
      render();resultError(error.message);
      return;
    }
  } else {
    state=await dbState();
    const s=state.schools[schoolId];
    rows=onlyYear(s.students,year).filter(s=>!s.archive&&[s.reg,s.national,...(parent?[s.phone]:[])].some(v=>v&&digits(v)===key));
    publicProof={school:schoolId,query:key,kind:parent?'parents':'results',year};
  }
  publicSchoolId=schoolId;
  publicMatches=rows;
  publicKey=key;
  publicPage=route;
  render();
  if(!rows.length)resultError();
}

function validateStudent(row,schoolData,id='') {
  for(const key of ['reg','national','phone'])row[key]=digits(row[key]);
  if(!row.reg||!row.name||!YEARS.includes(row.year)||!CLASSES.includes(row.cls)||!['ذكر','أنثى'].includes(row.gender)) throw new Error('أكمل السنة ورقم القيد والاسم والصف والجنس.');
  if(row.phone&&!/^09\d{8}$/.test(row.phone))throw new Error('رقم هاتف ولي الأمر يبدأ بـ09 ويتكون من 10 أرقام.');
  if(row.national&&!/^\d{12}$/.test(row.national))throw new Error('الرقم الوطني يتكون من 12 رقمًا.');
  if(['الثاني ثانوي','الثالث ثانوي'].includes(row.cls)) {
    if(!['علمي','أدبي'].includes(row.stream))throw new Error('حدد التخصص للصف الثانوي.');
  } else row.stream='';
  if(row.section&&!SECTIONS.includes(row.section))throw new Error('اختر فصلًا من القائمة.');
  const previous=id?schoolData.students.find(student=>student.id===id):null;
  if(previous&&(previous.cls!==row.cls||(previous.stream||'')!==(row.stream||''))&&Object.keys(schoolData.grades[id]||{}).length)throw new Error('السجل مرتبط بدرجات محفوظة في صفه الحالي.');
  const duplicate=schoolData.students.find(s=>s.year===row.year&&s.id!==id&&(normalized(s.reg)===normalized(row.reg)||row.national&&s.national===row.national));
  if(duplicate)throw new Error('رقم القيد أو الرقم الوطني مسجل بالفعل في السنة المختارة.');
}

};

function excelDate(value) {
  const text=str(value);
  if(!text)return '';
  if(/^\d{4}-\d\d-\d\d$/.test(text))return text;
  const format=text.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  if(format)return format[3]+'-'+format[2].padStart(2,'0')+'-'+format[1].padStart(2,'0');
  if(/^\d{4,5}$/.test(text))return new Date(Date.UTC(1899,11,30)+Number(text)*86400000).toISOString().slice(0,10);
  return text;
}

  const entries=columns.map(c=>[c.key,headings.findIndex(h=>normalized(h)===normalized(c.label))]).filter(([,i])=>i>=0);
  if(regCol<0||!entries.length)throw new Error('استخدم الكشف المصدّر من صفحة الرصد الحالية.');

    plan.components.map((label,i)=>['period:'+i,'صحيفة '+label.replace('أعمال - ','').replace(/^أعمال فترة .* - /,'')]);
  if(source==='add_grades')return [

    ['final','صحيفة النتيجة النهائية'],['double','صحيفة النتيجة النهائية (بطاقة بوجهين)'],['periods','صحيفة الفترات'],

  ];
  const items=[...groups,['final','صحيفة النتيجة النهائية'],['review','تقرير المراجعة']];

const verticalPending=new Map();
let verticalSaveQueue=Promise.resolve();
function verticalTypes(source,plan) {
  if(plan.components.length===4)return [
    ['w1',plan.components[0],[0]],['e1',plan.components[1],[1]],['we1',plan.components[0]+' + '+plan.components[1],[0,1]],
    ['w2',plan.components[2],[2]],['e2',plan.components[3],[3]],['we2',plan.components[2]+' + '+plan.components[3],[2,3]]
  ];
  return plan.components.map((label,i)=>['p'+(i+1),source==='student-grades-third-secondary'?label.replace(' -','-'):label,[i]]);
}
function verticalSubjectLabel(source,subject) {
  if(source==='student-grades-ninth'&&subject.key==='i')return 'التربية الاسلامية';
  if(source==='student-grades-ninth'&&subject.key==='e')return 'اللغة الانجليزية';
  if(subject.key==='b')return 'الاحياء';
  return subject.label;
}
function verticalView() {
  const page='vertical-grades';
  const f=filterData(page,{cls:'الأول',stream:'علمي',subject:'',type:'',limit:'10',sort:'section_name'});
  const source=routeForClass(f.cls), stream=['الثاني ثانوي','الثالث ثانوي'].includes(f.cls)?f.stream||'علمي':'';
  const plan=gradePlan(source,f.cls,stream), types=verticalTypes(source,plan);
  const type=types.find(([key])=>key===f.type)||types[0], item=plan.items.find(x=>x.key===f.subject);
  const rows=item?activeStudents(f.year).filter(x=>x.cls===f.cls&&(!stream||x.stream===stream)&&finds(x.name,f.q)):[];
  const compare=(a,b)=>{
    if(f.sort==='roll')return localeCompare(a.reg,b.reg);
    if(f.sort==='gender')return Number(a.gender==='أنثى')-Number(b.gender==='أنثى')||localeCompare(a.name,b.name);
    if(f.sort==='name'||f.sort==='alpha_arabic')return localeCompare(a.name,b.name);
    return localeCompare(a.section,b.section)||localeCompare(a.name,b.name);
  };
  rows.sort((a,b)=>(f.dir==='تنازلي'?-1:1)*compare(a,b));
  return {f,source,stream,plan,types,type,item,rows};
}
function verticalFilters(view) {

}

function verticalTable(view,paging) {

  const search=`<form data-form="vertical-search" role="search" class="vertical-search">${field(['q','بحث باسم الطالب:','search'],f.q,{placeholder:'اكتب الاسم الأول أو جزء من الاسم...'})}</form>`;

  const body=paging.rows.map((s,n)=>[paging.offset+n+1,s.reg,s.name,...indexes.map(i=>verticalCell(s,view,i))]);
  const count=Math.max(1,Math.ceil(rows.length/Number(f.limit))), page=Math.min(count,Math.max(1,Number(f.page)||1));
  const start=Math.max(1,Math.min(page-3,count-6)), end=Math.min(count,start+6);
  const controls=Array.from({length:end-start+1},(_,i)=>i+start).map(n=>`<button type="button" class="btn tiny ${n===page?'':'outline-blue'}" data-action="page" data-value="vertical-grades|${n}"${n===page?' aria-current="page"':''}>${n}</button>`).join('');

  if(el.matches('[data-vertical-mark]'))queueVerticalSave(el);

document.addEventListener('keydown',event=>{
  const el=event.target;
  if(!el.matches('[data-vertical-mark]')||!['Enter','ArrowDown','ArrowUp'].includes(event.key))return;
  event.preventDefault();
  const row=el.closest('tr'), column=el.closest('td').cellIndex;
  const next=event.key==='ArrowUp'?row.previousElementSibling:row.nextElementSibling;
  queueVerticalSave(el);
  const target=next?.cells[column]?.querySelector('input');
  if(target){target.focus();target.select();}
  else if(event.key==='Enter')el.blur();
});
function queueVerticalSave(el) {
  const {student,key,saved}=el.dataset, schoolId=activeSchoolId, entryKey=draftKey(student,key);
  const prior=verticalPending.get(entryKey);
  const value=el.value;
  if(prior?.value===value||!prior&&value===saved)return;
  const [source,subject,indexText]=key.split('|'), index=Number(indexText);
  const snapshot=school().students.find(row=>row.id===student);
  const item=snapshot&&gradePlan(source,snapshot.cls,snapshot.stream).items.find(row=>row.key===subject);
  if(!item)return;
  try{validatedGrade(value,item,index);}
  catch(error){el.setAttribute('aria-invalid','true');el.dataset.saveState='error';flash(error.message,'error');return;}
  el.removeAttribute('aria-invalid');
  el.dataset.saveState='saving';
  const entry={value};
  verticalPending.set(entryKey,entry);
  verticalSaveQueue=verticalSaveQueue.then(async()=>{
    if(verticalPending.get(entryKey)!==entry)return;
    if(!session||activeSchoolId!==schoolId){verticalPending.delete(entryKey);return;}
    const before=school().grades[student]?.[key]??'';
    let mark;
    if(sharedMode){
      const reply=await sharedAPI('/api/vertical-mark',{school:schoolId,student,source,subject,index,value,before});
      mark=reply.mark;
      if(activeSchoolId===schoolId&&route==='vertical-grades'&&reply.revision>=sharedRevision){
        sharedRevision=reply.revision;
        const record=school().grades[student] ||= {};
        if(mark===null)delete record[key];else record[key]=mark;
      }
    }else{
      await dbState(root=>{
        const s=root.schools[schoolId];
        const current=s.grades[student]?.[key]??'';
        if(String(current)!==String(before)&&String(current)!==String(value))throw new Error('تغيّرت الدرجة من تبويب آخر. حدّث الصفحة ثم أعد المحاولة.');
        mark=setGradeMark(s,s.students.find(row=>row.id===student),source,subject,index,value);
      }).then(next=>{state=next;});
      announceLocalChange();
    }
    if(verticalPending.get(entryKey)!==entry)return;
    verticalPending.delete(entryKey);
    if(route!=='vertical-grades'||activeSchoolId!==schoolId)return;
    const field=$$('[data-vertical-mark]').find(x=>x.dataset.student===student&&x.dataset.key===key);
    if(field){
      field.dataset.saved=String(mark??'');
      if(field.value===value||document.activeElement!==field)field.value=String(mark??'');
      field.dataset.saveState='saved';
    }
    if($('#vertical-status'))$('#vertical-status').textContent='حُفظت الدرجة';
  }).catch(async error=>{
    if(verticalPending.get(entryKey)!==entry)return;
    verticalPending.delete(entryKey);
    if(route==='vertical-grades'&&activeSchoolId===schoolId){
      if(sharedMode&&error.status===409){await refreshShared().catch(()=>{});render();}
      const field=$$('[data-vertical-mark]').find(x=>x.dataset.student===student&&x.dataset.key===key);
      if(field)field.dataset.saveState='error';
      flash(error.message||'تعذر حفظ الدرجة.','error');
    }
  });
}

function toggleFields(element,visible) {

function updateHallFields(form) {
  const values=form.elements;
  for(const element of $$('[data-hall-mode]',form))toggleFields(element,element.dataset.hallMode===values.mode.value);
  for(const element of $$('[data-class-rooms]',form))toggleFields(element,values['class'+element.dataset.classRooms].checked);
  for(const element of $$('[data-hall-custom]',form))toggleFields(element,element.dataset.hallCustom===values.customType.value);
  toggleFields($('[data-number-range]',form),values.generation.value!=='random');
  toggleFields($('[data-number-step]',form),values.generation.value==='step');
  if(values.mode.value!=='custom')return;
  const container=$('[data-room-capacities]',form), count=values.customType.value==='count';
  const from=count?1:Number(values.customFrom.value), to=count?Number(values.customCount.value):Number(values.customTo.value);
  const rooms=from>0&&to>=from&&to-from<50?Array.from({length:to-from+1},(_,i)=>from+i):[];
  const previous=new Map($$('input',container).map(el=>[el.name,el.value]));
  container.innerHTML=rooms.map(room=>roomField('capacity'+room,'عدد الطلبة في القاعة '+room,previous.get('capacity'+room)??30,1000)).join('');
}

function hallRange(from,to,limit=100) {
  const first=Number(from),last=Number(to);
  if(!Number.isInteger(first)||!Number.isInteger(last)||first<1||last>999||last<first||last-first>=limit)throw new Error('تحقق من نطاق القاعات المحدد.');
  return Array.from({length:last-first+1},(_,i)=>first+i);
}
function randomBelow(size) {
  const values=new Uint32Array(1), limit=2**32-(2**32%size);
  do {crypto.getRandomValues(values);} while(values[0]>=limit);
  return values[0]%size;
}
function randomized(list) {
  for(let i=list.length-1;i>0;i--){
    const j=randomBelow(i+1);
    [list[i],list[j]]=[list[j],list[i]];
  }
  return list;
}
function allocateExamNumbers(start,end,step,count,used,random,min,max) {
  const first=Number(start),last=Number(end);
  if(!Number.isSafeInteger(first)||!Number.isSafeInteger(last)||first<min||last>max||last<first||!Number.isSafeInteger(step)||step<1)throw new Error('تحقق من حدود أرقام الجلوس والأرقام السرية والفاصل.');
  const size=Math.floor((last-first)/step)+1;
  const excluded=[...used].filter(n=>n>=first&&n<=last&&(n-first)%step===0).length;
  if(size-excluded<count)throw new Error('نطاق الأرقام المتاح لا يكفي لجميع الطلاب.');
  const result=[];
  if(random&&count+excluded<size/3) {
    while(result.length<count){
      const number=first+randomBelow(size)*step;
      if(used.has(number))continue;
      used.add(number);
      result.push(number);
    }
  } else {
    for(let i=0;i<size&&(random||result.length<count);i++){
      const number=first+i*step;
      if(!used.has(number))result.push(number);
    }
    if(random)randomized(result);
  }
  return result.slice(0,count);
}
function distributeHallRows(students,data) {
  const roomAssignments=new Map();
  const assign=(people,rooms,capacity=null)=>{
    const size=Math.ceil(people.length/rooms.length);
    if(capacity){
      if(capacity.reduce((n,max)=>n+max,0)<people.length)throw new Error('سعة القاعات المحددة لا تكفي لجميع الطلاب.');
      let index=0;
      rooms.forEach((room,i)=>{for(let n=0;n<capacity[i]&&index<people.length;n++)roomAssignments.set(people[index++].id,room);});
    } else {
      people.forEach((student,i)=>roomAssignments.set(student.id,data.order==='متتابع'?rooms[Math.floor(i/size)]:rooms[i%rooms.length]));
    }
  };
  if(data.mode==='gender'){
    const male=hallRange(data.maleFrom,data.maleTo), female=hallRange(data.femaleFrom,data.femaleTo);
    if(male.some(room=>female.includes(room)))throw new Error('اختر نطاقين مختلفين لقاعات الذكور والإناث.');
    assign(students.filter(s=>s.gender==='ذكر'),male);
    assign(students.filter(s=>s.gender==='أنثى'),female);
  }else if(data.mode==='class_based'){
    const usedRooms=new Set();
    for(const [i,cls] of examsClasses.entries())if(data['class'+i]){
      const rooms=hallRange(data['classFrom'+i],data['classTo'+i]);
      if(rooms.some(room=>usedRooms.has(room)))throw new Error('نطاق قاعات أحد الصفوف يتداخل مع صف آخر.');
      rooms.forEach(room=>usedRooms.add(room));
      assign(students.filter(s=>s.cls===cls),rooms);
    }
  }else if(data.mode==='custom'){
    const rooms=data.customType==='range'?hallRange(data.customFrom,data.customTo,50):hallRange(1,data.customCount,50);
    const capacities=rooms.map(room=>Number(data['capacity'+room]));
    if(capacities.some(n=>!Number.isInteger(n)||n<1||n>1000))throw new Error('أدخل عدد الطلبة المخصص لكل قاعة.');
    assign(students,rooms,capacities);
  }else{
    assign(students,data.mode==='range'?hallRange(data.hallFrom,data.hallTo):hallRange(1,data.rooms));
  }
  return roomAssignments;
}
forms.hall=async data=>{
  const stages=examsClasses.filter((_,i)=>data['class'+i]);
  if(!stages.length||!YEARS.includes(data.year)||!str(data.exam)||!str(data.head))throw new Error('اختر السنة والصفوف وأدخل اسم المشرف ورئيس اللجنة.');
  let count=0;
  await update(s=>{
    const students=onlyYear(s.students,data.year).filter(x=>!x.archive&&stages.includes(x.cls)&&(!data.remedial||studentResult(x,s).status==='دور ثان'));
    if(!students.length)throw new Error('لا توجد سجلات للصفوف المختارة.');
    students.sort((a,b)=>localeCompare(a.name,b.name)||localeCompare(a.reg,b.reg));
    if(data.distribution==='random')randomized(students);
    const rooms=distributeHallRows(students,data);
    const selected=new Set(students.map(x=>x.id));
    const allocated=Object.entries(s.hall).filter(([id,h])=>h.year===data.year&&!selected.has(id)).map(([,h])=>h);
    const usedSeats=new Set(allocated.map(h=>Number(h.seat))), usedSecrets=new Set(allocated.map(h=>Number(h.secret)));
    const any=data.generation==='random', step=data.generation==='step'?Number(data.step):1;
    const seats=allocateExamNumbers(any?100000:data.first,any?999999:data.seatEnd,step,students.length,usedSeats,any||data.seatOrder==='random',100000,999999);
    const secrets=allocateExamNumbers(any?1000:data.secretStart,any?9999:data.secretEnd,step,students.length,usedSecrets,any||data.secretOrder==='random',1000,9999);
    students.forEach((student,i)=>{
      s.hall[student.id]={year:data.year,seat:seats[i],secret:secrets[i],room:rooms.get(student.id),exam:str(data.exam),head:str(data.head)};
    });
    count=students.length;
  });
  filters[route]={...filters[route],year:data.year};render();flash('تم توليد أرقام الجلوس لـ '+count+' طالب.');
};

forms.observers=async data=>{

  for(const exam of exams) {

const slotKey=(day,i)=>day+'|'+i;
const scheduleKey=(year,cls,section,shift)=>[year,cls,section,shift].join('|');
const scheduleFilter=[FILTER_YEAR,FILTER_CLASS,FILTER_SECTION,['shift','الفترة',['صباحية','مسائية']]];
function scheduleTable(record,editor=false) {

  const staff=onlyYear(schoolData.staff,record.year).filter(x=>schoolData.teachers.includes(x.id));
  const rows=work.map(day=>[day,...PERIODS.map((_,i)=>{

    return raw(`<label class="field"><select name="subject!${esc(key)}" aria-label="${esc(day+' المادة '+PERIODS[i])}">${options(subjects.map(s=>[s.id,s.name]),row?.subject,'اختر المادة')}</select><select name="teacher!${esc(key)}" aria-label="${esc(day+' المعلم '+PERIODS[i])}">${options(staff.map(s=>[s.id,s.name]),row?.teacher,'اختر المعلم')}</select></label>`);
  })]);
  return {rows,headers:['اليوم / الحصة',...PERIODS]};
}
function emptySchedule(f,type='manual') {return {year:f.year,cls:f.cls,section:f.section,shift:f.shift,slots:{},type};}

forms['manual-schedule']=async data=>{

forms['auto-schedule']=async data=>{
  const periods=Number(data.periods), year=data.year;
  let omitted=0, total=0;
  await update(s=>{
    const days=s.days[year]||DAYS.slice(0,5), assignments=onlyYear(s.assignments,year).sort((a,b)=>b.lessons-a.lessons);
    if(!assignments.length)throw new Error('أضف إسنادات لهذا العام قبل توليد الجدول.');
    const busy=new Set();
    for(const [key,record] of Object.entries(s.schedules)) {
      if(record.year!==year)continue;
      if(record.type==='auto')delete s.schedules[key];
      else for(const [slot,row] of Object.entries(record.slots))busy.add(record.shift+'|'+slot+'|'+row.teacher);
    }
    for(const a of assignments){
      const key=scheduleKey(year,a.cls,a.section,a.shift);
      const schedule=s.schedules[key] ||= emptySchedule(a,'auto');
      if(schedule.type==='manual')continue;
      const daily=new Map(days.map(day=>[day,0]));
      for(let n=0;n<a.lessons;n++){
        const choices=[...days].sort((d1,d2)=>daily.get(d1)-daily.get(d2));
        let placed=false;
        for(const day of choices){
          const slot=Array.from({length:periods},(_,i)=>slotKey(day,i)).find(slot=>!schedule.slots[slot]&&!busy.has(a.shift+'|'+slot+'|'+a.teacher)&&teacherAvailable(s,a.teacher,year,slot));
          if(!slot)continue;
          schedule.slots[slot]={teacher:a.teacher,subject:a.subject};busy.add(a.shift+'|'+slot+'|'+a.teacher);daily.set(day,daily.get(day)+1);placed=true;total++;break;
        }
        if(!placed)omitted++;
      }
    }
  });
  autoSummary='تم إسناد '+total+' حصة'+(omitted?'، وتعذر إسناد '+omitted+' بسبب قيود التوقيت.':'.');
  filters[route]={...filters[route],year};render();flash('حُفظت الجداول التجريبية.');
};

function parseMoney(value) {
  const input=digits(value);
  if(!/^\d{1,8}(\.\d{1,3})?$/.test(input))throw new Error('أدخل مبلغًا صحيحًا بثلاث خانات عشرية على الأكثر.');
  return Math.round(Number(input)*1000);
}

function financeOf(s,schoolData=school()) {
  const tuition=schoolData.fees[yearKey(s.year,s.cls)]||0;
  const items=(schoolData.feeItems||[]).filter(row=>row.year===s.year&&(!row.cls||row.cls===s.cls));
  const carried=sum(Object.values(schoolData.carriedBalances?.[s.id]||{}));
  const gross=tuition+carried+sum(items.map(row=>row.amount));
  const discount=schoolData.discounts[s.id]||0;
  const net=Math.max(0,gross-discount);
  const paid=sum(schoolData.receipts.filter(r=>r.student===s.id&&!r.void).map(r=>r.amount));
  return {tuition,items,carried,gross,discount,net,paid,left:Math.max(0,net-paid),status:!gross?'بلا رسوم':paid>=net?'مسدد':paid?'سداد جزئي':'غير مسدد'};
}

};

  if(!Number.isInteger(count)||count<1||count>12)throw new Error('أدخل عدد أقساط بين 1 و12.');

function installmentRows(s,account) {
  const plan=school().installments?.[yearKey(s.year,s.cls)];
  if(!plan)return [];
  const first=new Date(plan.start+'T12:00:00'), normal=Math.floor(account.net/plan.count);
  let paid=account.paid;
  return Array.from({length:plan.count},(_,i)=>{
    const date=new Date(first.getFullYear(),first.getMonth()+i,1,12);
    const last=new Date(date.getFullYear(),date.getMonth()+1,0,12).getDate();
    date.setDate(Math.min(first.getDate(),last));
    const amount=i===plan.count-1?account.net-normal*i:normal;
    const received=Math.min(amount,paid);paid-=received;
    return [i+1,dayISO(date),money(amount),money(received),money(amount-received)];
  });
}

forms['carry-balances']=async data=>{
  if(!YEARS.includes(data.from)||!YEARS.includes(data.to)||Number(data.to.slice(0,4))!==Number(data.from.slice(0,4))+1)throw new Error('اختر سنتين دراسيتين متتاليتين.');
  let added=0, missing=0;
  await update(s=>{
    const previous=onlyYear(s.students,data.from), next=onlyYear(s.students,data.to).filter(row=>!row.archive);
    const matches=new Map(next.map(row=>[normalized(row.reg),row]));
    for(const student of previous){
      const remainder=financeOf(student,s).left, destination=matches.get(normalized(student.reg));
      if(!remainder)continue;
      if(!destination){missing++;continue;}
      if(destination.national&&student.national&&destination.national!==student.national){missing++;continue;}
      const balances=s.carriedBalances[destination.id] ||= {};
      if(Object.hasOwn(balances,data.from))continue;
      balances[data.from]=remainder;
      added++;
    }
  });
  $('#modal').close();render();flash('رُحّل رصيد '+added+' سجل'+(missing?' · تعذر العثور على '+missing+' سجل مطابق.':'.'));
};

actions['payment-workbook']=()=>showDialog('استيراد وتصدير إكسل',`<form data-form="import-payments" class="stack"><p>حمّل القالب، واكتب مرجعًا فريدًا لكل دفعة ورقم القيد والمبلغ والتاريخ.</p>${field(FILTER_YEAR,filterData(route).year)}${field(['file','ملف Excel','file',true],'',{accept:'.xlsx'})}<div class="btns">${submit('استيراد الدفعات')}${btn('تنزيل قالب الدفعات','payment-template')}${btn('تصدير كشف الحسابات','payments-report','excel')}</div></form>`);
actions['payment-template']=()=>downloadExcel('قالب استيراد الدفعات',paymentWorkbookHeaders,[]);
forms['import-payments']=async data=>{
  const rows=await readExcel(data.file), headings=rows.shift()||[];
  const columns=paymentWorkbookHeaders.map(label=>headings.findIndex(x=>normalized(x)===normalized(label)));
  if(columns.slice(0,4).some(i=>i<0))throw new Error('أعمدة الملف غير مطابقة لقالب الدفعات.');
  let imported=0, duplicate=0;
  await update(s=>{
    const refs=new Map(s.receipts.filter(r=>r.year===data.year&&r.importRef).map(r=>[r.importRef,r]));
    const students=new Map(onlyYear(s.students,data.year).filter(row=>!row.archive).map(row=>[normalized(row.reg),row]));
    let number=Math.max(0,...s.receipts.map(r=>r.number));
    for(const [i,row] of rows.entries()){
      if(!row.some(value=>str(value)))continue;
      try{
        const [ref,reg,rawAmount,rawDate,method,note]=columns.map(col=>str(row[col]));
        const amount=parseMoney(rawAmount), date=excelDate(rawDate), student=students.get(normalized(reg));
        if(!ref||ref.length>100||!student||!amount||!/^\d{4}-\d{2}-\d{2}$/.test(date)||method&&!['نقدي','تحويل','صك'].includes(method))throw new Error('راجع المرجع ورقم القيد والمبلغ والتاريخ وطريقة الدفع.');
        const old=refs.get(ref);
        if(old){
          if(old.student!==student.id||old.amount!==amount||old.date!==date)throw new Error('مرجع الدفعة مستخدم لقيد مختلف.');
          duplicate++;continue;
        }
        if(amount>financeOf(student,s).left)throw new Error('المبلغ يتجاوز المتبقي.');
        const receipt={id:uid(),student:student.id,year:data.year,number:++number,amount,date,method:method||'نقدي',note,importRef:ref};
        s.receipts.push(receipt);refs.set(ref,receipt);imported++;
      }catch(error){throw new Error('الصف '+(i+2)+' · '+error.message);}
    }
    if(!imported&&!duplicate)throw new Error('لا توجد دفعات في الملف.');
  });
  $('#modal').close();render();flash('استُوردت '+imported+' دفعة'+(duplicate?' · سبق تسجيل '+duplicate:''));
};
actions.ledger=type=>{

forms.subuser=async(data,form)=>{
  const id=form.dataset.id||uid(), username=str(data.username), name=str(data.name);
  if(username.length<3||!name)throw new Error('أكمل الاسم واسم المستخدم.');
  const row={id,username,name,active:Boolean(data.active),permissions:Object.keys(data).filter(k=>k.startsWith('perm!')).map(k=>k.slice(5))};
  if(sharedMode){
    await runWorkflow('subuser-save',{...row,id:form.dataset.id,password:data.password});
    $('#modal').close();render();flash('حُفظ المستخدم الفرعي.');
    return;
  }
  if(data.password){row.salt=uid();row.digest=await passwordHash(data.password,row.salt);}
  await update((s,root)=>{
    const users=Object.values(root.schools).flatMap(x=>[x.profile,...x.users]);
    if(users.some(x=>x.id!==id&&normalized(x.username)===normalized(username)))throw new Error('اسم المستخدم مستخدم بالفعل.');
    const existing=s.users.find(u=>u.id===id);
    if(existing)Object.assign(existing,row);
    else if(row.digest)s.users.push(row);
    else throw new Error('أدخل كلمة مرور للتجربة.');
  });
  $('#modal').close();render();flash('حُفظ المستخدم الفرعي.');
};
function canAccess(page) {
  if(page==='data-transfer')return session?.role==='admin';
  if(PUBLIC.includes(page)||session?.role==='admin')return true;
  if(sharedMode)return Boolean(session&&(page==='dashboard'||page==='reference'||session.permissions.includes(page)));
  const user=school().users.find(u=>u.id===session?.userId&&u.active);
  return Boolean(user&&(page==='dashboard'||page==='reference'||user.permissions.includes(page)));
}

function outcomeReport(kind,title,year,summaries) {
  if(kind==='rate'){
    const counted=summaries.filter(x=>x.complete&&x.status);
    const rows=['ناجح','دور ثان','راسب'].map(status=>{
      const n=counted.filter(x=>x.status===status).length;
      return [status,n,counted.length?(100*n/counted.length).toFixed(2)+'%':'—'];
    });
    rows.push(['غير محتسب',summaries.length-counted.length,'—']);
    return showReport(title,year,['الحالة','العدد','النسبة'],rows);
  }
  if(kind==='subject-count'){

function gradePaperPeriods(view,indices) {
  const primary=view.source==='add_grades';
  const labels=primary?['الفترة الأولى (30%)','الفترة الثانية (30%)','الفترة الثالثة (40%)']:view.plan.components;
  if(indices)return [{label:primary?labels[indices[0]].split(' (')[0]:indices.length===1?labels[indices[0]]:indices[0]===0?'الفصل الأول':'الفصل الثاني',indices}];
  const groups=primary||labels.length!==4?labels.map((label,i)=>({label,indices:[i]})):[{label:'الفصل الأول',indices:[0,1]},{label:'الفصل الثاني',indices:[2,3]}];
  return [...groups,{label:'النتيجة النهائية (100%)',indices:null}];
}
function gradePaperMarks(view,student,groups) {
  const marks=(view.school||school()).grades[student.id]||{};
  const scores=groups.map(group=>gradeSummary(view.plan,view.source,marks,group.indices));
  const header=`<tr><th rowspan="2" scope="col">المادة</th>${groups.map(group=>`<th colspan="2" scope="colgroup">${esc(group.label)}</th>`).join('')}</tr><tr>${groups.map(()=>'<th scope="col">الدرجة الكبرى</th><th scope="col">درجة التلميذ</th>').join('')}</tr>`;
  const rows=view.plan.items.map((item,i)=>[item.label,...scores.flatMap(score=>[score.rows[i][2],score.rows[i][1]])]);
  const numeric=view.plan.items.some(item=>!item.choices);
  if(numeric)rows.push(['المجموع الكلي',...scores.flatMap(score=>[sum(score.rows.map(row=>typeof row[2]==='number'?row[2]:0))||'—',score.complete?score.total:'—'])]);
  return `<table class="school-paper-table grade-marks" aria-label="درجات التلميذ"><colgroup><col>${'<col>'.repeat(groups.length*2)}</colgroup><thead>${header}</thead><tbody>${rows.map(row=>'<tr>'+row.map(value=>'<td>'+esc(value)+'</td>').join('')+'</tr>').join('')}</tbody></table>`;
}
function gradePaperActivity(view,student,groups) {
  const activity=gradePlan('add_activity_grades',student.cls,student.stream);
  const grades=(view.school||school()).grades[student.id]||{};
  const periodGroups=groups.filter(group=>group.indices);
  const rows=activity.items.filter(item=>item.choices).map(item=>[item.label,...periodGroups.map(group=>{
    const i=activity.components.length===2&&view.plan.components.length===4?Math.floor(group.indices[0]/2):group.indices[0];
    return grades[gradeKey('add_activity_grades',item.key,i)]??'—';
  })]);
  return paperTable(['مواد النشاط',...periodGroups.map(group=>'أداء التلميذ خلال '+group.label.split(' (')[0])],rows);
}
function gradePaperSide(view,summary,groups,period) {
  const s=summary.s, columns=[['اسم التلميذ',s.name],['رقم القيد',s.reg],['الصف',s.cls],['الفصل',s.section],...(s.stream?[['التخصص',s.stream]]:[])];
  const details=`<div class="paper-student">${studentAvatar(s,true)}<dl>${columns.map(([label,value])=>'<dt>'+label+'</dt><dd>'+esc(value||'—')+'</dd>').join('')}</dl></div>`;
  const data=(view.school||school()).grades[s.id]||{};
  const activityGroups=groups.filter(group=>group.indices);
  const counts=key=>activityGroups.map(group=>{
    const i=view.plan.components.length===4?Math.floor(group.indices[0]/2):group.indices[0];
    return data[gradeKey('add_activity_grades',key,i)]??'—';
  });
  const summaryTable=period?paperTable(['ملاحظات على أداء التلميذ خلال '+activityGroups[0].label],[['']]):paperTable(['النتيجة النهائية'],[[summary.status||'—'],[summary.percent===null?'—':summary.percent+'%']]);
  return summaryTable+details+paperTable(['الغياب',...activityGroups.map(group=>group.label.split(' (')[0])],[['مشروع (أيام)',...counts('ex')],['غير مشروع (أيام)',...counts('un')]]);
}
function gradeCardReport(view,title,summaries,indices,type) {
  const groups=gradePaperPeriods(view,indices);
  const year=view.f.year;
  const heading=type==='period'?'بطاقة تقدير درجات '+groups[0].label+' للعام الدراسي '+year+' م':
    type==='final'?'بطاقة تقدير الدرجات للعام الدراسي '+year+' م':title+' للعام الدراسي '+year+' م';
  const settings={cellPadding:view.plan.items.length>10?4:7};
  const profile=(view.school||school()).profile;
  const markup=summaries.map(summary=>{
    const marks=gradePaperMarks(view,summary.s,groups);
    const activity=['add_grades','student-grades-sse','student-grades-first-secondary','student-grades-second-secondary'].includes(view.source)?gradePaperActivity(view,summary.s,groups):'';
    const side=gradePaperSide(view,summary,groups,indices!==null);
    const sign=paperTable(['التوقيعات',...(indices?[groups[0].label]:[])],[['معلم الفصل',...(indices?['']:[])],['مدير المدرسة',...(indices?['']:[])],['ولي أمر التلميذ',...(indices?['']:[])]]);
    const body=type==='double'?`<div class="grade-paper-grid"><div class="grade-paper-main">${activity}${sign}</div><div class="grade-paper-side">${side}</div></div>`:
      `<div class="grade-paper-grid"><div class="grade-paper-main">${marks}${activity}${sign}</div><div class="grade-paper-side">${side}</div></div>`;
    const page=paperFrame(heading,year,body,{variant:'grades',profile,settings,signatures:false});
    return type==='double'?page+paperFrame('بيان الدرجات · الوجه الخلفي',year,marks,{variant:'grades',profile,settings,meta:esc(summary.s.name)+' · '+esc(summary.s.reg),signatures:false}):page;
  }).join('')||paperFrame(heading,year,notice('لا توجد سجلات مطابقة.'),{variant:'grades',profile});
  showDocument(title,[],[],markup,'عمودي');
}

function detailedHallReport(kind,year,rows) {
  const title=HALL_REPORTS.find(([key])=>key===kind)?.[1]||'كشف أرقام الجلوس';
  const records=rows.map(student=>({student,hall:school().hall[student.id]}));
  if(kind==='cards'){
    const cards=records.map(({student,hall})=>paperTable(['اسم الطالب','الصف','رقم الجلوس','القاعة'],[[student.name,student.cls,hall.seat,hall.room]]));
    const body=cards.length?Array.from({length:Math.ceil(cards.length/8)},(_,i)=>paperFrame('بطاقات أرقام الجلوس',year,'<div class="paper-seat-cards">'+cards.slice(i*8,i*8+8).join('')+'</div>',{variant:'hall'})).join(''):paperFrame(title,year,notice('لا توجد أرقام جلوس في الكشف.'),{variant:'hall'});
    return showDocument(title,[],[],body,'عمودي');
  }
  if(kind==='shading'){
    const candidates=records.filter(({student})=>['التاسع','الثالث ثانوي'].includes(student.cls));
    const columns=['الخانة',...Array.from({length:10},(_,n)=>n)];
    const markup=candidates.map(({hall})=>{
      const digits=String(hall.seat).split('');
      const values=digits.map((digit,i)=>[i+1,...Array.from({length:10},(_,n)=>Number(digit)===n?'●':'○')]);
      return paperFrame('نموذج تظليل رقم الجلوس',year,paperTable(columns,values),{variant:'hall',meta:'<span>رقم الجلوس: <bdi>'+esc(hall.seat)+'</bdi></span>'});
    }).join('')||paperFrame(title,year,notice('لا توجد أرقام جلوس لطلبة الشهادات في الكشف.'),{variant:'hall'});
    return showDocument(title,[],[],markup,'عمودي');
  }
  const order=kind==='class'||kind==='secret'?['cls']:kind.includes('class')?['room','cls']:['room'];
  records.sort((a,b)=>{
    for(const key of order){
      const diff=key==='cls'?localeCompare(a.student.cls,b.student.cls):a.hall.room-b.hall.room;
      if(diff)return diff;
    }
    return a.hall.seat-b.hall.seat;
  });
  let headers=['القاعة','الصف','رقم الجلوس','اسم الطالب','الفصل'];
  let values=(student,hall)=>[hall.room,student.cls,hall.seat,student.name,student.section];
  if(kind.startsWith('secret')||kind==='answer'){
    headers=['القاعة','الصف','رقم الجلوس','الرقم السري',...(kind==='answer'?['توقيع الاستلام']:[])];
    values=(student,hall)=>[hall.room,student.cls,hall.seat,hall.secret,...(kind==='answer'?['']:[])];
  }
  if(kind==='marks-secret'){
    headers=['القاعة','الصف','الرقم السري','الدرجة','ملاحظات'];
    values=(student,hall)=>[hall.room,student.cls,hall.secret,'',''];
  }
  if(kind==='mirror'){
    headers=['الصف','رقم القيد','اسم الطالب','رقم الجلوس','الرقم السري','المادة','الدرجة'];
    values=(student,hall)=>[student.cls,student.reg,student.name,hall.seat,hall.secret,'',''];
  }
  const groupMap=new Map();
  for(const {student,hall} of records){
    const key=order.map(item=>item==='cls'?student.cls:hall.room).join('|');
    if(!groupMap.has(key))groupMap.set(key,{rows:[],meta:`${order.includes('room')?'<span>القاعة: <bdi>'+esc(hall.room)+'</bdi></span>':''}${order.includes('cls')?'<span>الصف: '+esc(student.cls)+'</span>':''}<span>المشرف: ${esc(hall.exam)}</span><span>رئيس اللجنة: ${esc(hall.head)}</span>`});
    groupMap.get(key).rows.push(values(student,hall));
  }
  schoolListReport(title,year,headers,[...groupMap.values()],{variant:'hall',twoColumns:kind.endsWith('-parallel')});
}

let teacherSaveQueue=Promise.resolve();
function queueTeacherField(control) {
  const form=control.form, data=teacherAccessData(), value=control.value;
  if(!data||value===control.dataset.prior||control.dataset.saving===value)return;
  const {assignment,date,lesson,attendanceMode}=data;
  const action=form.dataset.form==='teacher-grades'?'grades':'attendance';
  const identity=data.staff.id;
  control.dataset.saving=value;
  teacherSaveQueue=teacherSaveQueue.then(async()=>{
    if(teacherAccessData()?.staff.id!==identity||control.dataset.saving!==value)return;
    const student=control.name.slice(5), marks=[{student,value,before:control.dataset.prior}];
    const details={assignment,marks,date,lesson,attendanceMode,index:Number(form.dataset.index)};
    const text=action==='grades'?'حُفظت الدرجة.':'حُفظ سجل الحضور والغياب.';
    await commitTeacher(action,details,text,false);
    const record=teacherAccessData()?.students.find(x=>x.id===student);
    const saved=action==='grades'?record?.marks[record.fields.findIndex(f=>f.index===details.index)]??value:record?.attendance??value;
    control.dataset.prior=String(saved);
    if(control.value===value){
      control.value=String(saved);
      const total=$('[data-teacher-total]',control.closest('tr'));
      if(total)total.textContent=saved===''?'—':String(saved);
    }
    control.removeAttribute('aria-invalid');
    if($('#teacher-grade-state')&&action==='grades')$('#teacher-grade-state').textContent=text;
    else if(route==='teachers')flash(text);
  }).catch(error=>{
    control.setAttribute('aria-invalid','true');
    if(route==='teachers')flash(error.message,'error');
  }).finally(()=>{if(control.dataset.saving===value)delete control.dataset.saving;});
}
async function commitTeacher(action,details,notification,redraw=true) {
  const data=teacherAccessData();
  if(!data)throw new Error('سجّل دخول بوابة المعلمين أولًا.');
  const filters={...teacherFilters,assignment:data.assignment};
  const payload={...details,assignment:details.assignment||data.assignment};
  if(sharedMode){
    try{teacherData=(await sharedAPI('/api/teacher-action',{action,details:payload,filters})).workspace;}
    catch(error){
      if(error.status===401){resetTeacher();$('#modal').close();render();}
      else if(redraw){await refreshTeacher();render();}
      throw error;
    }
  }else await updateLocalSchool(teacherSchoolId,s=>{
    const staff=s.staff.find(x=>x.id===teacherSession&&x.year===YEAR&&s.teacherCodes[x.id]?.active);
    if(!staff)throw new Error('حساب المعلم غير مفعّل.');
    applyTeacherAction(s,staff,action,payload,uid());
  });
  if(redraw){$('#modal').close();render();flash(notification);}
}

  if(transferInbox&&['kind','cls','stream'].includes(control.name))
    transferInbox.mapping=transferSuggestedMapping(transferInbox.table.headers,transferFields(currentTransferScope()));
  transferReview=null;
  transferRefresh(control.name);
});
forms['transfer-file']=async(data,form)=>{
  transferAdmin();
  const file=data.file, startSchool=activeSchoolId, startRole=session.role;
  const extension=file?.name.toLowerCase().split('.').at(-1);
  let tableData;
  if(extension==='xlsx'){
    const [headers,...rows]=await readExcel(file);
    tableData={headers,rows};
  }else if(['csv','tsv'].includes(extension)&&file.size>0&&file.size<=7_500_000){
    const bytes=new Uint8Array(await file.arrayBuffer());
    let text;
    if(bytes[0]===255&&bytes[1]===254)text=new TextDecoder('utf-16le').decode(bytes);
    else if(bytes[0]===254&&bytes[1]===255)text=new TextDecoder('utf-16be').decode(bytes);
    else try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}
    catch{text=new TextDecoder('windows-1256').decode(bytes);}
    tableData=transferDelimited(text,extension);
  }else throw new Error('اختر ملف XLSX أو CSV أو TSV صالحًا.');
  if(!form.isConnected||route!=='data-transfer'||activeSchoolId!==startSchool||session?.role!==startRole)return;
  stageTransferTable({table:tableData,source:file.name});
  render();
};
actions['transfer-clear']=()=>{
  transferInbox=null;transferReview=null;render();
};
actions['transfer-auto']=()=>{
  if(!transferInbox)return;
  transferInbox.mapping=transferSuggestedMapping(transferInbox.table.headers,transferFields(currentTransferScope()));
  transferReview=null;render();
};
function localTransferPlan(root,id,tableData,scope) {
  const pending=new Set(root.transfers.filter(row=>row.from===id&&row.status==='pending').map(row=>row.student));
  return prepareDataTransfer(root.schools[id],tableData,scope,pending);
}
forms['transfer-preview']=async(_data,form)=>{
  transferAdmin();
  const inbox=transferInbox;
  if(!inbox)return;
  const tableData=inbox.table, scope={...currentTransferScope(),mapping:[...inbox.mapping]}, schoolId=activeSchoolId;
  const review=sharedMode?await sharedAPI('/api/data-transfer',{action:'preview',school:schoolId,table:tableData,scope}):
    localTransferPlan(await dbState(),schoolId,tableData,scope);
  if(!form.isConnected||inbox!==transferInbox||schoolId!==activeSchoolId||session?.role!=='admin')return;
  transferReview={...review,table:tableData,scope,schoolId};
  render();
};
actions['transfer-apply']=async()=>{
  transferAdmin();
  const review=transferReview;
  if(!review||review.schoolId!==activeSchoolId)throw new Error('أعد معاينة الكشف قبل الحفظ.');
  let result;
  try{
    if(sharedMode)result=await sharedAPI('/api/data-transfer',{action:'apply',school:review.schoolId,table:review.table,scope:review.scope,revision:review.revision});
    else await updateLocalSchool(review.schoolId,(s,root)=>{
      const current=localTransferPlan(root,review.schoolId,review.table,review.scope);
      if(JSON.stringify(current.changes)!==JSON.stringify(review.changes))throw new Error('تغيّرت بيانات المدرسة منذ المعاينة. أعد المعاينة قبل الحفظ.');
      applyDataTransfer(s,current,uid);
      result=current;
    });
  }catch(error){
    if(transferReview===review){transferReview=null;render();}
    throw error;
  }
  const {added,updated,grades}=result.summary;
  if(transferReview===review){transferReview=null;transferInbox=null;render();}
  flash('تم الحفظ · '+added+' طالب جديد · '+updated+' سجل محدث · '+grades+' درجة.');
};
actions['transfer-template']=()=>{
  transferAdmin();
  const scope=currentTransferScope();
  transferScope(scope);
  downloadExcel('قالب '+transferKinds.find(([key])=>key===scope.kind)[1],transferFields(scope).map(field=>field.label),[]);
};
actions['transfer-export']=async()=>{
  transferAdmin();
  const schoolId=activeSchoolId, scope=currentTransferScope();
  const data=sharedMode?await sharedAPI('/api/data-transfer',{action:'export',school:schoolId,scope}):
    exportDataTransfer((await dbState()).schools[schoolId],scope);
  if(route!=='data-transfer'||schoolId!==activeSchoolId||session?.role!=='admin')return;
  if(!data.rows.length)throw new Error('لا توجد سجلات ضمن الاختيارات.');
  downloadExcel('كشف '+transferKinds.find(([key])=>key===scope.kind)[1]+' '+scope.year,data.headers,data.rows);
};

start();
</script>
